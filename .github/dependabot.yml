version: 2
updates:
  # Python の依存（requirements.txt）。月1回・同時に2本まで
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
  # ワークフローの Actions。まとめて月1回にして手間を減らす
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns: ["*"]
