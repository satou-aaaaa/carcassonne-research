name: test

on:
  push:
    branches: [main]
  pull_request:
  # CI が作った自動の PR は、マージ前に scripts/merge_via_pr.sh がこれで検査を回す（GITHUB_TOKEN の PR では pull_request の実行が承認待ちになるため）
  workflow_dispatch:

# 外部の人の PR でも動くので、トークンは読むだけにする
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
          cache: pip
      - run: pip install -r requirements.txt
      - name: "確認: scripts/check.py（ruff・整形・公開ページ・全テスト）"
        run: python scripts/check.py

  # 集めた対局データ（人が送ってくれた棋譜）は足すだけ。消えた・書き換わった変更はここで止める
  # （scripts/check_data_append_only.py。2026-11-12 satou「データが紛失したら困る」）
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: "確認: 対局データが減っていない"
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'origin/main' }}
        run: |
          # main への push で前の版が無い（新しいブランチ・強制 push の後）ときは main の1つ前と比べる
          git cat-file -e "$BASE^{commit}" 2>/dev/null || BASE=HEAD~1
          python3 scripts/check_data_append_only.py --base "$BASE"

  # ワークフローの書き間違い（式・権限・run: の中のシェル）を actionlint で見る。
  # selfplay・AI content の手順は本番でしか動かない所が多く、書き間違いが数時間後に初めて出るので、PR の時点で止める
  # （shared-workflows incidents/2026-11-03-carcassonne-auto-pr-ci-noise.md の残りの対策）。
  # 版は shared-workflows の scripts/setup.sh と同じ。run: の中は ubuntu の runner に入っている shellcheck で見る。
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "確認: actionlint"
        env:
          VER: "1.7.7"
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/rhysd/actionlint/releases/download/v${VER}/actionlint_${VER}_linux_amd64.tar.gz" | tar xz actionlint
          command -v shellcheck
          ./actionlint -color .github/workflows/*.yml

  # 公開ページの UI 点検（スマホ幅・PC幅。scripts/ui_check.mjs、目で見る手順は .claude/skills/ui-check）
  ui:
    # ubuntu-latest が 26.04 に変わり、Playwright 1.56.1 が Chromium を入れられなくなった（2026-11-06）。
    # Playwright が対応している版に固定する。Playwright を上げるときは、対応する Ubuntu を確かめてから外す
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: "準備: Playwright と Chromium"
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          # 依存パッケージ（フォントなど）は apt で入れる。ランナーの apt ミラーが名前解決に失敗することがある
          # （2026-11-11 #166 で2回続けて落ちた）ので、間をおいて3回まで試す。
          # それでもだめなら Chromium だけ入れて続ける（ubuntu-24.04 のイメージには動かすのに要るライブラリが入っている）
          for i in 1 2 3; do
            sudo apt-get update -o Acquire::Retries=3 || true
            if npx playwright install --with-deps chromium; then exit 0; fi
            echo "::warning::Playwright の依存パッケージを入れられませんでした（${i}回目）"
            sleep $((i * 20))
          done
          npx playwright install chromium
      - name: "確認: UI 点検（scripts/ui_check.mjs）"
        run: node scripts/ui_check.mjs
