name: test

on:
  push:
    branches: [main]
  pull_request:

# 外部の人の PR でも動くので、トークンは読むだけにする
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          cache: pip
      - run: pip install -r requirements.txt
      - name: "確認: scripts/check.py（ruff・整形・公開ページ・全テスト）"
        run: python scripts/check.py

  # 公開ページの UI 点検（スマホ幅・PC幅。scripts/ui_check.mjs、目で見る手順は .claude/skills/ui-check）
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: "準備: Playwright と Chromium"
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: "確認: UI 点検（scripts/ui_check.mjs）"
        run: node scripts/ui_check.mjs
