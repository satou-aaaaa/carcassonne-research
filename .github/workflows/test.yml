name: test

on:
  push:
    branches: [main]
  pull_request:
  # CI が作った自動の PR は、マージ前に scripts/merge_via_pr.sh がこれで検査を回す（GITHUB_TOKEN の PR では pull_request の実行が承認待ちになるため）
  workflow_dispatch:

# 外部の人の PR でも動くので、トークンは読むだけにする
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
          cache: pip
      - run: pip install -r requirements.txt
      - name: "確認: scripts/check.py（ruff・整形・公開ページ・全テスト）"
        run: python scripts/check.py

  # ワークフローの書き間違い（式・権限・run: の中のシェル）を actionlint で見る。
  # selfplay・AI content の手順は本番でしか動かない所が多く、書き間違いが数時間後に初めて出るので、PR の時点で止める
  # （shared-workflows incidents/2026-11-03-carcassonne-auto-pr-ci-noise.md の残りの対策）。
  # 版は shared-workflows の scripts/setup.sh と同じ。run: の中は ubuntu の runner に入っている shellcheck で見る。
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "確認: actionlint"
        env:
          VER: "1.7.7"
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/rhysd/actionlint/releases/download/v${VER}/actionlint_${VER}_linux_amd64.tar.gz" | tar xz actionlint
          command -v shellcheck
          ./actionlint -color .github/workflows/*.yml

  # 公開ページの UI 点検（スマホ幅・PC幅。scripts/ui_check.mjs、目で見る手順は .claude/skills/ui-check）
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: "準備: Playwright と Chromium"
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: "確認: UI 点検（scripts/ui_check.mjs）"
        run: node scripts/ui_check.mjs
