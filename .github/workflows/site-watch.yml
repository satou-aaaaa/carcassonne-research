name: Site watch

# 公開中のページ（GitHub Pages の /docs）が開けるかを毎日見る（Claude は使わない）。中身は共通部品 satou-aaaaa/shared-workflows。
on:
  schedule:
    # 毎日 06:17 JST（= 21:17 UTC）。朝のタスク整理の前に結果が出るように
    - cron: "17 21 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: read

concurrency:
  group: site-watch
  cancel-in-progress: false

jobs:
  watch:
    uses: satou-aaaaa/shared-workflows/.github/workflows/site-watch.yml@main
    with:
      # 公開URLからの相対パス（空白区切り）。トップページは常に見る
      paths: index.html play.html rules.html strategy.html quiz.html ai_tips.html carcassonne_engine.js
