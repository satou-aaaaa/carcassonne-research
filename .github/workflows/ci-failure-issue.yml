name: CI failure issue

# デフォルトブランチ（main）で下のワークフローが失敗したら、ラベル ci-failure の Issue を1件立てる
# （同じワークフローの Issue が開いていればコメントを足す）。次に成功したら、その Issue を自動で閉じる。
# 監督エージェントが毎回 API で失敗を探す代わりに、この Issue を見るだけで済むようにするためのもの（Claude は使わない）。
on:
  workflow_run:
    workflows: ["test", "selfplay"]
    types: [completed]

permissions:
  issues: write
  actions: read

concurrency:
  group: ci-failure-issue-${{ github.event.workflow_run.name }}
  cancel-in-progress: false

jobs:
  report:
    if: >-
      github.event.workflow_run.head_branch == github.event.repository.default_branch &&
      contains(fromJSON('["failure","success","timed_out"]'), github.event.workflow_run.conclusion)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Issue を立てる・閉じる
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WF_NAME: ${{ github.event.workflow_run.name }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          EVENT: ${{ github.event.workflow_run.event }}
        run: |
          set -euo pipefail
          title="CI失敗: ${WF_NAME}（main）"
          num=$(gh issue list --state open --label ci-failure --limit 50 --json number,title \
            --jq ".[] | select(.title == \"${title}\") | .number" | head -n1)
          if [ "$CONCLUSION" = "success" ]; then
            if [ -n "$num" ]; then
              gh issue close "$num" --comment "成功した実行が出たので閉じます: ${RUN_URL}"
            fi
            exit 0
          fi
          body="main で「${WF_NAME}」が ${CONCLUSION} になりました（きっかけ: ${EVENT}、コミット ${SHA:0:7}）。
          実行: ${RUN_URL}

          同じワークフローが次に成功すると、この Issue は自動で閉じます。"
          if [ -n "$num" ]; then
            gh issue comment "$num" --body "$body"
          else
            gh label create ci-failure --color B60205 --description "main の CI 失敗（自動）" 2>/dev/null || true
            gh issue create --title "$title" --label ci-failure --body "$body"
          fi
