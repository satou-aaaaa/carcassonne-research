name: Human games

# 対戦ページ（docs/play.html）から GitHub の Issue で送ってもらった棋譜を受け取る。
# 本文に目印（carcassonne-game-record）のある Issue が開かれたら、棋譜を検査して（ルールどおり再生できるか・
# 得点が合うか。src/carcassonne/human_games.py）data/human_games.jsonl に足し、弱点分析のまとめ
# docs/results/human_games.md を作り直して、PR で main に入れる（main は PR 必須なので scripts/merge_via_pr.sh）。
# 最後に結果を Issue に書いて閉じる（受け取れなかったものは「対応しない」で閉じる）。
# ためた棋譜は自己対戦ループの学習に混ざる（selfplay_loop.Config.human_games）。
# Google フォーム（アカウント不要、data/human_games_form.json）の回答は、公開 CSV を毎朝読んで同じように取り込む（form ジョブ）。
# Issue の本文・フォームの回答は誰でも書けるので、シェルに埋め込まず、イベントのファイルを Python が読む。
# 入れられないとき（検査が通らない・PR を作れない）はジョブを失敗にし（ci-failure-issue.yml が知らせる）、
# Issue は開いたまま残す（直したあと workflow_dispatch で番号を指定して受け取り直す）。

on:
  issues:
    types: [opened]
  schedule:
    # 毎朝 6:17 JST にフォームの回答を取り込む。
    # GitHub の schedule は混むと何時間も遅れたり、飛ばされたりする（2026-11-12 は5時間遅れ、11-13 は来なかった）。
    # https://docs.github.com/en/actions/writing-workflows/choosing-when-your-workflow-runs/events-that-trigger-workflows#schedule
    # そのため同じ日のうちに予備の回を2つ置く（8:47・12:47 JST）。取り込み済みの局は数えるだけなので、
    # 朝の回が動いていれば予備の回は何もしない（human_games.ingest_rows）。
    - cron: "17 21 * * *"
    - cron: "47 23 * * *"
    - cron: "47 3 * * *"
  workflow_dispatch:
    inputs:
      issue:
        description: "受け取り直す Issue の番号（空ならフォームの回答を取り込む）"
        required: false
        default: ""

concurrency:
  group: human-games
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  pages: write # マージ後に公開を起こす（GITHUB_TOKEN のコミットでは自動で走らない）
  actions: write # merge_via_pr.sh が、マージ前の検査（test・Secret scan）を workflow_dispatch で起こす

jobs:
  ingest:
    if: (github.event_name == 'workflow_dispatch' && inputs.issue != '') || (github.event_name == 'issues' && contains(github.event.issue.body, 'carcassonne-game-record'))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ISSUE: ${{ github.event.issue.number || inputs.issue }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
          cache: pip
      - run: pip install -r requirements.txt
      - name: 棋譜を検査して足す
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            source scripts/gh_retry.sh
            ghr gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE" --jq '{issue: .}' > event.json
          else
            cp "$GITHUB_EVENT_PATH" event.json
          fi
          python scripts/human_games.py ingest-issue --event event.json --result result.json
      - name: PR で main へ入れる
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(python -c "import json;print(json.load(open('result.json'))['status'])")
          [ "$status" = "added" ] || exit 0
          python scripts/human_games.py report
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/human_games.jsonl docs/results/human_games.md docs/human_games.json docs/human_games docs/human_findings.json docs/results/human_findings_cache.json
          git commit -q -m "人との対局の棋譜を受け取る（Issue #$ISSUE、自動）"
          bash scripts/merge_via_pr.sh human-games "人との対局の棋譜を受け取る（Issue #$ISSUE、自動）"
      - name: Issue に結果を書いて閉じる
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source scripts/gh_retry.sh
          python -c "import json;print(json.load(open('result.json'))['message'])" > body.md
          python scripts/cap_body.py body.md
          status=$(python -c "import json;print(json.load(open('result.json'))['status'])")
          reason=completed
          [ "$status" = "invalid" ] && reason="not planned"
          ghr gh issue comment "$ISSUE" --body-file body.md
          ghr gh issue close "$ISSUE" --reason "$reason"

  form:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.issue == '')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
          cache: pip
      - run: pip install -r requirements.txt
      - name: フォームの回答を検査して足す
        run: |
          python scripts/human_games.py ingest-form --result result.json
          # 受け取れなかった行は理由を要約に出す（黙って捨てると、送った人の棋譜が出ない理由が分からない）
          python - <<'PY'
          import json, os
          r = json.load(open("result.json"))
          lines = [f"フォームの棋譜: 追加 {r['added']}・受け取り済み {r['duplicate']}・受け取れない {r['invalid']}"]
          lines += [f"- {e}" for e in r.get("errors", [])]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("\n".join(lines) + "\n")
          for e in r.get("errors", []):
              print(f"::notice title=受け取れなかったフォームの回答::{e}")
          PY
      - name: PR で main へ入れる
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          added=$(python -c "import json;print(json.load(open('result.json'))['added'])")
          [ "$added" -gt 0 ] || exit 0
          python scripts/human_games.py report
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/human_games.jsonl docs/results/human_games.md docs/human_games.json docs/human_games docs/human_findings.json docs/results/human_findings_cache.json
          git commit -q -m "人との対局の棋譜をフォームから $added 局受け取る（自動）"
          bash scripts/merge_via_pr.sh human-games "人との対局の棋譜をフォームから $added 局受け取る（自動）"
      - name: 10局たまったら X 投稿の下書きを Issue で届ける
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 区切り（10局・20局…）ごとに1件。投稿は人がする。閉じたもの（投稿済み）も含め同じ題があれば作らない
          # Issue で届いた局も、次の朝のこの手順で数える
          source scripts/gh_retry.sh
          python scripts/human_games.py x-draft --title xtitle.txt --body xdraft.md
          title=$(cat xtitle.txt)
          [ -n "$title" ] || exit 0
          seen=$(ghr gh api "repos/$GITHUB_REPOSITORY/issues?state=all&per_page=100" --paginate \
            --jq "[.[] | select(.title == \"$title\")] | length" | awk '{s += $1} END {print s + 0}')
          [ "$seen" -gt 0 ] && exit 0
          url=$(gh_issue_create_once "$title" xdraft.md)
          # 前の区切りの下書きは新しい数字に置き換わったので閉じる（投稿されないまま開いた Issue がたまらないように、2026-11-14）
          ghr gh api "repos/$GITHUB_REPOSITORY/issues?state=open&per_page=100" --paginate \
            --jq ".[] | select(.pull_request == null) | select(.title | startswith(\"X投稿の下書き:\")) | select(.title != \"$title\") | .number" |
            while read -r n; do ghr gh issue close "$n" --reason "not planned" --comment "新しい下書きができたので閉じます（投稿するなら新しいほうを）: $url"; done
      - name: 取り込みが止まっていなかったか
        run: |
          # 送ってから 36 時間より長く取り込まれなかった棋譜があれば、朝の回も予備の回も動かなかった日がある。
          # 棋譜は上で取り込み済み。ジョブを失敗にして ci-failure-issue.yml の Issue で知らせる（次に成功すると閉じる）
          python - <<'PY'
          import json, sys
          late = json.load(open("result.json")).get("late", [])
          for m in late:
              print(f"::error title=フォームの取り込みが止まっていた::{m}")
          sys.exit(1 if late else 0)
          PY
