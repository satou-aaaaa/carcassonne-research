name: Secret scan

# PR と main への push で、API キーなどが混ざっていないかを調べる（Claude は使わない）。中身は共通部品 satou-aaaaa/shared-workflows。
on:
  pull_request:
  # CI が作った自動の PR は、マージ前に scripts/merge_via_pr.sh がこれで検査を回す（GITHUB_TOKEN の PR では pull_request の実行が承認待ちになるため）
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    uses: satou-aaaaa/shared-workflows/.github/workflows/secret-scan.yml@main
