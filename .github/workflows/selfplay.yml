name: selfplay

# 自己対戦ループ（scripts/selfplay_loop.py）を GitHub Actions で回す。
# 計算は Python だけで済むので、Claude を起こさずに CI で進める（公開リポジトリの Actions は無料）。
#
# 状態（state.json・直近の自己対戦データ・各世代の重み・progress.md）はブランチ selfplay-state の loop/ に置く。
# 履歴を増やさないよう、そのブランチは毎回1コミットだけの状態で上書きする（main には入れない）。
# selfplay-state ブランチが無いときは何もしない（共有フォルダから状態を移すまで、二重に回さないため）。
# 新しく「採用」が出たときだけ Issue を立てて知らせ（前の採用の Issue は閉じるので、開いているのはいつも最新の1件だけ）、
# 対戦ページ（docs/play.html）のAIも差し替える（main は PR 必須なので scripts/merge_via_pr.sh で PR を作ってすぐマージする）。
# 差し替えたら、学習ページ（コツ集・クイズ）を同じAIで作り直す ai-content.yml を起動する。

on:
  schedule:
    # 6時間ごと（UTC 1:17, 7:17, 13:17, 19:17）。GitHub の cron は数分〜数十分遅れることがある
    - cron: "17 1-23/6 * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "回す分数（単位の途中では止めない）"
        default: "300"

concurrency:
  group: selfplay
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write # 対戦ページのAIの差し替えを PR で main に入れる
  actions: write # 学習ページの作り直し（ai-content.yml）を起動する

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 状態ブランチがあるか確かめる
        id: state
        run: |
          if git ls-remote --exit-code --heads origin selfplay-state >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::selfplay-state ブランチが無いので何もしません（状態を移したら動き始めます）"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.state.outputs.exists == 'true'
        with:
          ref: selfplay-state
          path: state
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.state.outputs.exists == 'true'
        with:
          python-version-file: .python-version
          cache: pip
      - run: pip install -r requirements.txt
        if: steps.state.outputs.exists == 'true'
      - name: 自己対戦ループを回す
        if: steps.state.outputs.exists == 'true'
        env:
          MINUTES: ${{ inputs.minutes || '300' }}
        run: |
          rm -f state/loop/lock
          python -c "import json;print(sum(h['promoted'] for h in json.load(open('state/loop/state.json'))['history']))" > before.txt
          python scripts/selfplay_loop.py run --root state/loop --minutes "$MINUTES"
      - name: 古い自己対戦データを消す（学習に使うのは直近 window 試行分だけ）
        if: always() && steps.state.outputs.exists == 'true'
        run: |
          rm -f state/loop/lock
          python - <<'EOF'
          import json
          from pathlib import Path
          root = Path("state/loop")
          st = json.loads((root / "state.json").read_text(encoding="utf-8"))
          window = st.get("config", {}).get("window", 4)
          for f in (root / "data").glob("a*.npz"):
              if int(f.name[1:4]) <= st["attempt"] - window:
                  f.unlink()
          EOF
      - name: 状態を保存する
        if: always() && steps.state.outputs.exists == 'true'
        working-directory: state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan tmp
          git add -A -f loop
          git commit -q -m "自己対戦ループの状態 $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f origin tmp:selfplay-state
      - name: 対戦ページ（docs/play.html）のAIを最新チャンピオンに差し替える
        # 採用が無ければ unchanged で何もしない。PR で main へ入れ、入れられないときはジョブを失敗にする
        if: steps.state.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          result=$(python scripts/update_champion.py state/loop)
          echo "対戦ページのAI: $result"
          [ "$result" = "updated" ] || exit 0
          name=$(python -c "import json;print(json.load(open('models/eval_champion.json'))['name'])")
          python scripts/build_pages.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models/eval_champion.npy models/eval_champion.json docs
          git commit -q -m "対戦ページのAIを最新チャンピオン $name に差し替える（自動）"
          # 入れられなかったらジョブを失敗にする（ci-failure-issue.yml が Issue で知らせる）
          bash scripts/merge_via_pr.sh champion "対戦ページのAIを最新チャンピオン $name に差し替える（自動）"
      - name: 学習ページ（コツ集・クイズ）を最新チャンピオンで作り直す
        # 対戦ページのAIを差し替えたときだけ。重い（約1時間）ので別のワークフローで回す
        if: steps.state.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ "$(python scripts/refresh_ai_content.py --check)" = "stale" ] || exit 0
          gh workflow run ai-content.yml --ref main
      - name: 新しく採用が出たら Issue で知らせる
        if: steps.state.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          before=$(cat before.txt)
          after=$(python -c "import json;print(sum(h['promoted'] for h in json.load(open('state/loop/state.json'))['history']))")
          if [ "$after" -gt "$before" ]; then
            last=$(python -c "import json;h=[x for x in json.load(open('state/loop/state.json'))['history'] if x['promoted']][-1];print(f\"試行{h['attempt']}（勝率 {h['win_rate']:.3f}）\")")
            { echo "自己対戦ループで新しいチャンピオンが採用されました: $last"; echo; cat state/loop/progress.md; echo; echo "状態: https://github.com/${{ github.repository }}/tree/selfplay-state/loop"; } > body.md
            url=$(gh issue create --title "自己対戦ループ: $last を採用" --body-file body.md)
            # 前の採用の知らせは役目を終えたので閉じる（開いたままたまらないように）
            gh issue list --state open --limit 100 --json number,title,url \
              --jq ".[] | select(.title | startswith(\"自己対戦ループ: \")) | select(.url != \"$url\") | .number" |
              while read -r n; do gh issue close "$n" --comment "新しい採用が出たので閉じます: $url"; done
          fi
