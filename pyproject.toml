[project]
name = "carcassonne-research"
version = "0.1.0"
description = "Carcassonne (base game, 2 players) AI research"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "hypothesis", "ruff"]
analysis = ["numpy", "pandas", "matplotlib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
