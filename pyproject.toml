[project]
name = "carcassonne-research"
version = "0.1.0"
description = "Carcassonne (base game, 2 players) AI research"
requires-python = ">=3.11"
dependencies = ["numpy", "numba"]

[project.optional-dependencies]
dev = ["pytest", "hypothesis", "ruff"]
analysis = ["pandas", "matplotlib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["slow: 実行に時間のかかるテスト（CIの高速ジョブでは -m \"not slow\" で除外）"]

[tool.ruff]
line-length = 100
