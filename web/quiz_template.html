<title>カルカソンヌ 次の一手</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* レイアウト: 左に盤面、右に問題カード（狭い画面では縦積み）。盤面が主役、カードは操作盤。 */

}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121814; --surface: #1b231d; --ink: #e5ebe3; --muted: #9babA0; --line: #2d392f;
  --accent: #79c58a; --accent-ink: #0f1a12; --good: #63c486; --bad: #ec8467; --gold: #f0b94a;
  --p0: #ef6a62; --p1: #6c9bf0; --board: #18201a; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #121814; --surface: #1b231d; --ink: #e5ebe3; --muted: #9babA0; --line: #2d392f;
  --accent: #79c58a; --accent-ink: #0f1a12; --good: #63c486; --bad: #ec8467; --gold: #f0b94a;
  --p0: #ef6a62; --p1: #6c9bf0; --board: #18201a; color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 15px/1.7 var(--body); margin: 0; }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 40px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 20px; margin-bottom: 14px; }
h1 { font-family: var(--display); font-weight: 400; font-size: clamp(22px, 3.4vw, 30px); margin: 0; letter-spacing: .02em; text-wrap: balance; }
.sub { color: var(--muted); font-size: 13px; }
.progress { display: flex; gap: 6px; flex-wrap: wrap; }
.progress button { width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--surface); color: var(--muted); font: 600 12px var(--body); cursor: pointer; font-variant-numeric: tabular-nums; padding: 0; }

.progress button.ng { background: var(--bad); border-color: var(--bad); color: var(--surface); }
main { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 860px) {
  /* スマホでは盤面を上に貼り付け、選択肢を押したときに置いた形が見えるようにする。
     グリッドのままだと sticky が盤面の行の中でしか効かないので、縦積みはブロックで組む */

  main > .card { margin-top: 14px; }
  main > .boardbox { position: sticky; top: 0; z-index: 2; box-shadow: 0 6px 14px -10px rgba(0,0,0,.5); }
  canvas#board { max-height: 42vh; }

}
@media (hover: none) { .keys { display: none; } }
.keys { display: block; }

canvas#board { display: block; width: 100%; aspect-ratio: 1 / 1; max-width: 100%; touch-action: manipulation; }
.zoom { position: absolute; right: 10px; top: 8px; font: 600 12px var(--body); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 3px 10px; cursor: pointer; }
.legend { position: absolute; left: 10px; bottom: 8px; font-size: 12px; color: var(--muted); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 2px 8px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.eyebrow { font-size: 12px; letter-spacing: .08em; color: var(--muted); }
h2 { font-family: var(--display); font-weight: 400; font-size: 21px; margin: 0; line-height: 1.4; text-wrap: balance; }
.prompt { margin: 0; }
.situ { display: grid; grid-template-columns: auto 1fr 1fr; gap: 10px; align-items: center; }
.situ canvas { width: 76px; height: 76px; border-radius: 6px; display: block; }
.who { border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; font-size: 12.5px; color: var(--muted); line-height: 1.45; }
.who b { display: block; font-size: 22px; color: var(--ink); font-variant-numeric: tabular-nums; }
.who.me { border-left: 5px solid var(--me); } .who.op { border-left: 5px solid var(--op); }
.opts { display: grid; gap: 8px; }
.opt { display: grid; grid-template-columns: 34px 46px minmax(0, 1fr); gap: 10px; align-items: center; text-align: left; width: 100%; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 10px; padding: 8px 10px; font: inherit; cursor: pointer; }
.opt:hover:not(:disabled), .opt.sel { border-color: var(--ink); }
.opt:focus-visible, button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.opt:disabled { cursor: default; }
.opt .k { font-family: var(--display); font-size: 20px; text-align: center; }
.opt canvas { width: 46px; height: 46px; border-radius: 4px; display: block; }
.opt .t { font-weight: 500; line-height: 1.45; }

.opt.best { border-color: var(--good); }
.opt.wrong { border-color: var(--bad); }

.bar i { display: block; height: 100%; background: var(--muted); }
.opt.best .bar i { background: var(--good); }
.verdict { font-family: var(--display); font-size: 22px; }
.verdict.ok { color: var(--good); } .verdict.ng { color: var(--bad); }
.explain { display: flex; flex-direction: column; gap: 10px; }
.explain p { margin: 0; }
.lesson { border-left: 4px solid var(--gold); padding: 4px 0 4px 12px; font-weight: 500; }

.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn { font: 700 14px var(--body); padding: 9px 18px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn:disabled { opacity: .45; cursor: default; }
details { font-size: 13px; color: var(--muted); }
details summary { cursor: pointer; }
#remain { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
#remain div { text-align: center; font-size: 11px; width: 36px; font-variant-numeric: tabular-nums; }
#remain div.zero { opacity: .3; }
#remain canvas { width: 32px; height: 32px; display: block; }
.hintbox { border: 1px dashed var(--gold); border-radius: 10px; padding: 8px 12px; font-size: 13.5px; }
.hintbox b { color: var(--gold); }
.opt .t small.hint { color: var(--ink); }
.score { font-size: 12.5px; color: var(--muted); align-self: center; margin-left: 4px; font-variant-numeric: tabular-nums; }

.final { text-align: center; padding: 30px 10px; }
.final .big { font-family: var(--display); font-size: 44px; }
footer { margin-top: 22px; font-size: 12.5px; color: var(--muted); max-width: 70ch; }
@media (prefers-reduced-motion: no-preference) { .opt { transition: border-color .15s; } }
.lvl { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .08em; padding: 0 7px; border-radius: 3px; margin-right: 6px; background: var(--line); color: var(--ink); }
.lvl.easy { background: var(--accent); color: var(--accent-ink); }
.progress button.easy { border-style: dashed; }
nav.site { --paper: var(--surface); --field: var(--accent); }
__SITE_NAV_CSS__
</style>

<div class="wrap">
__SITE_NAV__
  <header>
    <div>
      <h1>カルカソンヌ 次の一手</h1>
      <div class="sub">強いAIが選んだ手を当てる練習問題。基本セット・2人対戦。<span id="levels"></span></div>
    </div>
    <nav class="progress" id="progress" aria-label="問題の一覧"></nav>
  </header>
  <main id="main">
    <div class="boardbox">
      <canvas id="board" aria-label="盤面"></canvas>

    </div>

  </main>
  <footer>
    AIの評価は、このプロジェクトの評価関数付きモンテカルロ木探索（1局面あたり約6万回の探索）が見積もった
    「この手を選んだ場合の最終的な点差（あなた−相手）」です。山札の順番は分からない前提で計算しているので、
    実際の対局ではAIの予想どおりにならないこともあります。数点の差は「どちらも悪くない」くらいに受け取ってください。
  </footer>
</div>

<script id="quiz-data" type="application/json">__QUIZ_DATA__</script>
<script>
"use strict";
const DATA = JSON.parse(document.getElementById("quiz-data").textContent);
const LIB = DATA.tiles, PUZ = DATA.puzzles;
const $ = id => document.getElementById(id);
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const KIND_JA = {C: "都市", R: "道", F: "草原", M: "修道院"};
const LETTERS = "ABCD";
// sel は選んだ手、peek はマウスを乗せているだけの手（盤面の表示は peek を優先）
let idx = 0, sel = null, peek = null;
const narrow = () => matchMedia("(max-width: 860px)").matches;
let zoomed = narrow();  // スマホでは選択肢のまわりに寄って表示する
const answers = {}, hinted = {};
try { Object.assign(answers, JSON.parse(localStorage.getItem("cc_quiz") || "{}")); } catch (e) {}
try { Object.assign(hinted, JSON.parse(localStorage.getItem("cc_quiz_hint") || "{}")); } catch (e) {}
const save = () => { try {
  localStorage.setItem("cc_quiz", JSON.stringify(answers));
  localStorage.setItem("cc_quiz_hint", JSON.stringify(hinted));
} catch (e) {} };

// ---------- タイル描画（web/play.html と同じ描き方） ----------
const EM = [[.5,0],[1,.5],[.5,1],[0,.5]];
const HP = [[.25,0],[.75,0],[1,.25],[1,.75],[.75,1],[.25,1],[0,.75],[0,.25]];
const D = 0.28;
function hull(pts) {
  pts = pts.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  const cr = (o, a, b) => (a[0]-o[0])*(b[1]-o[1]) - (a[1]-o[1])*(b[0]-o[0]);
  const lo = [], up = [];
  for (const p of pts) { while (lo.length >= 2 && cr(lo[lo.length-2], lo[lo.length-1], p) <= 0) lo.pop(); lo.push(p); }
  for (const p of pts.slice().reverse()) { while (up.length >= 2 && cr(up[up.length-2], up[up.length-1], p) <= 0) up.pop(); up.push(p); }
  return lo.slice(0, -1).concat(up.slice(0, -1));
}
function cityShapes(sides) {
  const trap = {0: [[0,0],[1,0],[.8,D],[.2,D]], 1: [[1,0],[1,1],[1-D,.8],[1-D,.2]], 2: [[0,1],[1,1],[.8,1-D],[.2,1-D]], 3: [[0,0],[0,1],[D,.8],[D,.2]]};
  const inner = {0:[[.2,D],[.8,D]], 1:[[1-D,.2],[1-D,.8]], 2:[[.2,1-D],[.8,1-D]], 3:[[D,.2],[D,.8]]};
  const shapes = sides.map(s => trap[s]);
  if (sides.length > 1) shapes.push(hull(sides.flatMap(s => inner[s])));
  return shapes;
}
function anchorOf(p) {
  if (p.kind === "M") return [.5, .5];
  if (p.kind === "C") {
    const inner = {0:[.5,D*.7], 1:[1-D*.7,.5], 2:[.5,1-D*.7], 3:[D*.7,.5]};
    const pts = p.sides.map(s => inner[s]);
    return [pts.reduce((a,q)=>a+q[0],0)/pts.length, pts.reduce((a,q)=>a+q[1],0)/pts.length];
  }
  if (p.kind === "R") {
    if (p.sides.length >= 2) {
      const pts = p.sides.map(s => EM[s]);
      const m = [pts.reduce((a,q)=>a+q[0],0)/pts.length, pts.reduce((a,q)=>a+q[1],0)/pts.length];
      return [m[0]*.5 + .25, m[1]*.5 + .25];
    }
    const e = EM[p.sides[0]]; return [e[0] + (.5-e[0])*.6, e[1] + (.5-e[1])*.6];
  }
  const pts = p.halves.map(h => HP[h]);
  const c = [pts.reduce((a,q)=>a+q[0],0)/pts.length, pts.reduce((a,q)=>a+q[1],0)/pts.length];
  return [c[0] + (.5-c[0])*.3, c[1] + (.5-c[1])*.3];
}
const anchorCache = new Map();
function anchors(t, v) {
  const key = t + ":" + v;
  if (anchorCache.has(key)) return anchorCache.get(key);
  const vr = LIB[t].variants[v], res = vr.pieces.map(p => anchorOf(p));
  const dist = (a, b) => Math.hypot(a[0]-b[0], a[1]-b[1]);
  vr.pieces.forEach((p, i) => {
    if (p.kind !== "F") return;
    const others = res.filter((_, j) => j !== i);
    if (others.every(o => dist(o, res[i]) > .2)) return;
    let best = res[i], bs = -1;
    for (const h of p.halves) {
      const c = [HP[h][0] + (.5-HP[h][0])*.2, HP[h][1] + (.5-HP[h][1])*.2];
      const sc = Math.min(...others.map(o => dist(o, c)));
      if (sc > bs) { bs = sc; best = c; }
    }
    res[i] = best;
  });
  anchorCache.set(key, res); return res;
}
const tileCache = new Map();
function tileCanvas(t, v) {
  const key = t + ":" + v;
  if (tileCache.has(key)) return tileCache.get(key);
  const S = 128, c = document.createElement("canvas"); c.width = c.height = S;
  const g = c.getContext("2d"), vr = LIB[t].variants[v];
  g.fillStyle = "#86b96a"; g.fillRect(0, 0, S, S);
  const pt = q => [q[0]*S, q[1]*S];
  const path = pts => { g.beginPath(); pts.forEach((q, i) => { const [x, y] = pt(q); i ? g.lineTo(x, y) : g.moveTo(x, y); }); g.closePath(); };
  const roads = vr.pieces.filter(p => p.kind === "R");
  const drawRoads = (w, col) => {
    g.strokeStyle = col; g.lineWidth = w; g.lineCap = "butt"; g.lineJoin = "round";
    for (const r of roads) {
      g.beginPath();
      if (r.sides.length >= 2) {
        const a = pt(EM[r.sides[0]]), b = pt(EM[r.sides[1]]), m = pt([.5, .5]);
        g.moveTo(a[0], a[1]); g.lineTo(m[0], m[1]); g.lineTo(b[0], b[1]);
      } else {
        const a = pt(EM[r.sides[0]]), f = roads.length >= 3 ? .78 : 1;
        g.moveTo(a[0], a[1]); g.lineTo(a[0] + (S/2 - a[0])*f, a[1] + (S/2 - a[1])*f);
      }
      g.stroke();
    }
  };
  drawRoads(S*.17, "#7a6a45"); drawRoads(S*.11, "#f3e7c3");
  if (roads.length >= 3) { g.fillStyle = "#7a6a45"; g.beginPath(); g.arc(S/2, S/2, S*.06, 0, 7); g.fill(); }
  const cities = vr.pieces.filter(p => p.kind === "C");
  g.lineJoin = "round";
  for (const ct of cities) for (const sh of cityShapes(ct.sides)) { path(sh); g.strokeStyle = "#5e3f26"; g.lineWidth = 6; g.stroke(); }
  for (const ct of cities) for (const sh of cityShapes(ct.sides)) { path(sh); g.fillStyle = "#c08a5a"; g.fill(); }
  for (const ct of cities) if (ct.pennant) {
    const [ax, ay] = anchorOf(ct).map(x => x * S);
    g.fillStyle = "#2f5fb5"; g.strokeStyle = "#fff"; g.lineWidth = 1.5;
    g.beginPath(); g.moveTo(ax-8, ay-10); g.lineTo(ax+8, ay-10); g.lineTo(ax+8, ay+3); g.lineTo(ax, ay+11); g.lineTo(ax-8, ay+3); g.closePath(); g.fill(); g.stroke();
  }
  if (vr.pieces.some(p => p.kind === "M")) {
    g.fillStyle = "#e9e1d0"; g.fillRect(S*.36, S*.46, S*.28, S*.2);
    g.fillStyle = "#b8403a"; g.beginPath(); g.moveTo(S*.32, S*.46); g.lineTo(S*.5, S*.3); g.lineTo(S*.68, S*.46); g.closePath(); g.fill();
    g.strokeStyle = "#5a3a2a"; g.lineWidth = 1.5; g.strokeRect(S*.36, S*.46, S*.28, S*.2);
  }
  g.strokeStyle = "rgba(0,0,0,.45)"; g.lineWidth = 1.5; g.strokeRect(.75, .75, S-1.5, S-1.5);
  tileCache.set(key, c); return c;
}
// 草原の農民は横に寝かせて描く（ボードゲームの慣習）
function meeple(g, x, y, r, col, ghost, lying) {
  g.save(); if (ghost) g.globalAlpha = .85;
  if (lying) { g.translate(x, y); g.rotate(-Math.PI / 2); g.translate(-x, -y); }
  g.fillStyle = col; g.strokeStyle = "#fff"; g.lineWidth = Math.max(1.5, r*.22);
  g.beginPath(); g.arc(x, y - r*.9, r*.75, 0, 7); g.fill(); g.stroke();
  g.beginPath(); g.moveTo(x - r*1.15, y + r*1.2); g.lineTo(x, y - r*.2); g.lineTo(x + r*1.15, y + r*1.2); g.closePath(); g.fill(); g.stroke();
  g.restore();
}
// 選択肢のサムネイル（タイル＋ミープル）
function optThumb(P, o, size) {
  const c = document.createElement("canvas"); c.width = c.height = size * 2;
  const g = c.getContext("2d"), [, , v, piece] = o.move;
  g.drawImage(tileCanvas(P.current, v), 0, 0, size*2, size*2);
  if (piece !== null) { const [ax, ay] = anchors(P.current, v)[piece]; meeple(g, ax*size*2, ay*size*2, size*.2, seatColor(P.player), false, isField(P.current, v, piece)); }
  return c;
}
const isField = (t, v, pi) => LIB[t].variants[v].pieces[pi].kind === "F";
const seatColor = p => css(p === 0 ? "--p0" : "--p1");

// ---------- 盤面 ----------
const cv = $("board"), ctx = cv.getContext("2d");
let geo = null;
function bounds(cells) {
  const xs = cells.map(c => c[0]), ys = cells.map(c => c[1]);
  return {x0: Math.min(...xs), x1: Math.max(...xs), y0: Math.min(...ys), y1: Math.max(...ys)};
}
// 盤面全体の範囲と、選択肢のマスのまわり（上下左右2マス）に寄った範囲
function extents(P) {
  const opts = P.options.map(o => [o.move[0], o.move[1]]);
  const all = bounds(P.board.map(b => [b.x, b.y]).concat(opts)), o = bounds(opts), R = 2;
  const focus = {x0: Math.max(all.x0, o.x0 - R), x1: Math.min(all.x1, o.x1 + R), y0: Math.max(all.y0, o.y0 - R), y1: Math.min(all.y1, o.y1 + R)};
  const area = e => (e.x1 - e.x0 + 1) * (e.y1 - e.y0 + 1);
  return {all, focus: area(focus) < area(all) * .7 ? focus : null};
}
function draw() {
  const P = PUZ[idx]; if (!P) return;
  const ex = extents(P), e = zoomed && ex.focus ? ex.focus : ex.all, nx = e.x1 - e.x0 + 1.6, ny = e.y1 - e.y0 + 1.6;
  cv.style.aspectRatio = `${Math.max(.8, Math.min(1.5, nx / ny))}`;
  const r = cv.getBoundingClientRect(), dpr = devicePixelRatio || 1, W = r.width, H = r.height;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W, H);
  const s = Math.min(W / nx, H / ny, 110);
  const zb = $("btnZoom"); zb.hidden = !ex.focus; zb.textContent = e === ex.all ? "選択肢に寄る" : "全体を見る";
  const ox = W/2 - (e.x0 + e.x1 + 1) * s / 2, oy = H/2 + (e.y0 + e.y1) * s / 2 - s/2;
  geo = {s, ox, oy};
  const L = x => ox + x*s, T = y => oy - y*s;
  for (const b of P.board) ctx.drawImage(tileCanvas(b.t, b.v), L(b.x), T(b.y), s, s);
  for (const m of P.meeples) {
    const b = P.board.find(q => q.x === m.x && q.y === m.y), [ax, ay] = anchors(b.t, b.v)[m.piece];
    meeple(ctx, L(m.x) + ax*s, T(m.y) + ay*s, s*.1, seatColor(m.player), false, isField(b.t, b.v, m.piece));
  }
  const done = answers[P.id] !== undefined;
  const cur = peek !== null ? peek : sel, show = cur !== null ? P.options[cur] : null;
  const ink = css("--ink"), good = css("--good");
  for (const [k, list] of cellGroups(P)) {
    const [x, y] = k.split(",").map(Number);
    if (show && show.move[0] === x && show.move[1] === y) continue;
    const isBest = done && list.includes(P.best);
    ctx.fillStyle = "rgba(255,255,255,.6)"; ctx.fillRect(L(x)+3, T(y)+3, s-6, s-6);
    ctx.strokeStyle = isBest ? good : "#26342a"; ctx.lineWidth = isBest ? 3 : 2; ctx.setLineDash([5, 4]);
    ctx.strokeRect(L(x)+3, T(y)+3, s-6, s-6); ctx.setLineDash([]);
    ctx.fillStyle = "#1d2820"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    const label = list.map(i => LETTERS[i]).join("/");
    ctx.font = `${Math.round(s * (label.length > 1 ? .22 : .34))}px ${css("--display")}`;
    ctx.fillText(label, L(x) + s/2, T(y) + s/2);
  }
  if (show) {
    const [x, y, v, piece] = show.move;
    ctx.drawImage(tileCanvas(P.current, v), L(x), T(y), s, s);
    ctx.strokeStyle = css("--gold"); ctx.lineWidth = 3; ctx.strokeRect(L(x)+1.5, T(y)+1.5, s-3, s-3);
    if (piece !== null) { const [ax, ay] = anchors(P.current, v)[piece]; meeple(ctx, L(x) + ax*s, T(y) + ay*s, s*.11, seatColor(P.player), true, isField(P.current, v, piece)); }
  }
  $("legend").textContent = show ? `${LETTERS[cur]} を表示中` : "点線のマスが選択肢";
}
function cellGroups(P) {
  const m = new Map();
  P.options.forEach((o, i) => { const k = o.move[0] + "," + o.move[1]; if (!m.has(k)) m.set(k, []); m.get(k).push(i); });
  return m;
}
$("btnZoom").onclick = () => { zoomed = !zoomed; draw(); };
cv.addEventListener("click", ev => {
  const P = PUZ[idx]; if (!P || !geo) return;
  const r = cv.getBoundingClientRect(), px = ev.clientX - r.left, py = ev.clientY - r.top;
  const x = Math.floor((px - geo.ox) / geo.s), y = Math.floor((geo.oy - py) / geo.s) + 1;
  const list = cellGroups(P).get(x + "," + y); if (!list) return;
  const at = list.indexOf(sel);
  select(list[(at + 1) % list.length]);
});

// ---------- 問題カード ----------
function optLabel(o) {
  const m = o.facts.meeple;
  return m ? `${m.kind_ja}にミープルを置く` : "ミープルは置かない";
}
function optSub(o) {
  const f = o.facts, parts = [];
  if (f.gain_me || f.gain_opp) parts.push(`置いた直後に あなた+${f.gain_me}点` + (f.gain_opp ? `・相手+${f.gain_opp}点` : ""));
  if (f.meeple && f.meeple.returned) parts.push("ミープルはすぐ戻る");
  return parts.join(" ／ ") || "その場の得点なし";
}
const fmt = d => (d >= 0 ? "+" : "−") + Math.abs(d).toFixed(1);
function select(i) {
  sel = i; peek = null; draw();
  document.querySelectorAll(".opt").forEach((b, j) => b.classList.toggle("sel", j === i));
  const go = $("btnGo"); if (go) go.disabled = sel === null;
}
function render() {
  const P = PUZ[idx], card = $("card");
  renderProgress();
  if (!P) return renderFinal();
  const ans = answers[P.id], done = ans !== undefined, me = P.player, op = 1 - me;
  document.documentElement.style.setProperty("--me", seatColor(me));
  document.documentElement.style.setProperty("--op", seatColor(op));
  const colorJa = p => p === 0 ? "赤" : "青";
  card.innerHTML = `
    <div class="eyebrow">${P.level === "入門" ? '<span class="lvl easy">入門</span>' : '<span class="lvl">実戦</span>'}問題 ${idx + 1} / ${PUZ.length} ・ 第${P.turn}手 ・ 山札の残り ${P.deck_left}枚</div>
    <h2>${P.title}</h2>
    <p class="prompt">${P.prompt} <b>AIならどの手を選ぶでしょう？</b></p>
    <div class="situ">
      <canvas id="curTile" width="152" height="152" aria-label="引いたタイル"></canvas>
      <div class="who me">あなた（${colorJa(me)}）<b>${P.scores[me]}点</b>手持ちミープル ${P.supply[me]}</div>
      <div class="who op">相手（${colorJa(op)}）<b>${P.scores[op]}点</b>手持ちミープル ${P.supply[op]}</div>
    </div>
    <div class="opts" id="opts"></div>
    <div id="after"></div>
    <div class="row" id="actions"></div>
    <details><summary>山札に残っているタイル（公開情報）</summary><div id="remain"></div></details>`;
  $("curTile").getContext("2d").drawImage(tileCanvas(P.current, 0), 0, 0, 152, 152);
  const bestDiff = P.options[P.best].diff, worst = Math.min(...P.options.map(o => o.diff));
  P.options.forEach((o, i) => {
    const b = document.createElement("button");
    b.className = "opt"; b.type = "button";
    if (done) b.classList.add(i === P.best ? "best" : i === ans ? "wrong" : "x");
    const k = document.createElement("span"); k.className = "k"; k.textContent = LETTERS[i];
    const t = document.createElement("span"); t.className = "t";
    let html = optLabel(o);
    if (!done && hinted[P.id]) html += `<small class="hint">${optSub(o)}</small>`;
    if (done) {
      html += `<small>${optSub(o)}</small>`;
      const gap = o.diff - bestDiff, w = worst < bestDiff ? 35 + 65 * (o.diff - worst) / (bestDiff - worst) : 100;
      html += `<small>AIの予想点差 <b>${fmt(o.diff)}</b>${i === P.best ? "（最善）" : `（最善より ${Math.abs(gap).toFixed(1)}点 損）`}${i === ans ? " ← あなたの答え" : ""}</small><span class="bar"><i style="width:${w}%"></i></span>`;
      if (o.note) html += `<small>${o.note}</small>`;
    }
    t.innerHTML = html;
    b.append(k, optThumb(P, o, 23), t);
    b.onclick = () => select(i);
    // マウスを乗せると盤面に仮表示（押すまでは選択は変わらない）
    b.onpointerenter = ev => { if (ev.pointerType === "mouse") { peek = i; draw(); } };
    b.onpointerleave = () => { if (peek !== null) { peek = null; draw(); } };
    $("opts").appendChild(b);
  });
  const act = $("actions");
  if (!done) {
    act.innerHTML = `<button class="btn primary" id="btnGo" disabled>この手に決める</button>`
      + (hinted[P.id] ? "" : `<button class="btn" id="btnHint">ヒント</button>`)
      + `<span class="note">選択肢か盤面の点線マスを押すと、置いた形が盤面に表示されます。<span class="keys">キー操作: <kbd>A</kbd>〜<kbd>D</kbd> で選ぶ、<kbd>Enter</kbd> で決める、<kbd>←</kbd><kbd>→</kbd> で問題を移る。</span></span>`;
    if (hinted[P.id]) $("after").innerHTML = `<div class="hintbox"><b>ヒント</b> 各選択肢に、置いた直後に入る点数を表示しました。直後の点数が多い手が最善とは限りません。ミープルの数や、相手の都市・草原への影響も考えてみましょう。</div>`;
    $("btnGo").onclick = decide;
    if ($("btnHint")) $("btnHint").onclick = () => { hinted[P.id] = true; save(); render(); };
  } else {
    const ok = ans === P.best;
    $("after").innerHTML = `<div class="explain">
      <div class="verdict ${ok ? "ok" : "ng"}">${ok ? "正解！" : `AIの答えは ${LETTERS[P.best]}`}</div>
      ${ok ? "" : `<p class="note">あなたの答えは ${LETTERS[ans]}。選択肢を押すと、それぞれの置き方を盤面で見比べられます。</p>`}
      ${hinted[P.id] ? `<p class="note">この問題はヒントを見て解きました。</p>` : ""}
      ${P.explain.map(p => `<p>${p}</p>`).join("")}
      ${P.lesson ? `<p class="lesson">${P.lesson}</p>` : ""}</div>`;
    act.innerHTML = `<button class="btn primary" id="btnNext">${idx + 1 < PUZ.length ? "次の問題へ" : "結果を見る"}</button><button class="btn" id="btnRetry">解き直す</button>`;
    $("btnNext").onclick = () => go(idx + 1);
    $("btnRetry").onclick = () => { delete answers[P.id]; delete hinted[P.id]; save(); sel = null; render(); };
  }
  const rem = $("remain");
  LIB.forEach((t, i) => {
    const d = document.createElement("div"); if (!P.remaining[i]) d.className = "zero";
    const c = document.createElement("canvas"); c.width = c.height = 64; c.getContext("2d").drawImage(tileCanvas(i, 0), 0, 0, 64, 64);
    d.append(c, document.createTextNode("×" + P.remaining[i])); rem.appendChild(d);
  });
  select(sel);
}
function decide() {
  const P = PUZ[idx]; if (!P || sel === null || answers[P.id] !== undefined) return;
  answers[P.id] = sel; save(); sel = P.best; render();
  // 狭い画面では判定と解説が選択肢の下に出るので、そこまで送る
  if (narrow()) $("after").scrollIntoView({behavior: "smooth", block: "start"});
}
function renderFinal() {
  const n = PUZ.filter(p => answers[p.id] === p.best).length, a = PUZ.filter(p => answers[p.id] !== undefined).length;
  $("card").innerHTML = `<div class="final"><div class="eyebrow">結果</div><div class="big">${n} / ${PUZ.length}</div>
    <p>${a < PUZ.length ? `まだ解いていない問題が ${PUZ.length - a}問 あります。上の番号から選べます。` : n >= PUZ.length * .75 ? "AIとかなり近い考え方ができています。" : "間違えた問題の解説を読み返すと、AIの考え方が見えてきます。"}</p>
    <div class="row" style="justify-content:center"><button class="btn primary" id="btnAgain">最初から解き直す</button></div></div>`;
  $("btnAgain").onclick = () => { for (const k in answers) delete answers[k]; for (const k in hinted) delete hinted[k]; save(); go(0); };
  ctx.clearRect(0, 0, cv.width, cv.height); $("legend").textContent = "";
}
function renderProgress() {
  const nav = $("progress"); nav.innerHTML = "";
  PUZ.forEach((p, i) => {
    const b = document.createElement("button"); b.textContent = i + 1; b.type = "button";
    b.setAttribute("aria-label", `問題${i + 1}`);
    const a = answers[p.id];
    if (a !== undefined) b.className = a === p.best ? "ok" : "ng";
    if (p.level === "入門") b.classList.add("easy");
    if (i === idx) b.classList.add("cur");
    b.onclick = () => go(i); nav.appendChild(b);
  });
  const a = PUZ.filter(p => answers[p.id] !== undefined);
  if (a.length) {
    const sc = document.createElement("span"); sc.className = "score";
    sc.textContent = `正解 ${a.filter(p => answers[p.id] === p.best).length} / ${a.length}`;
    nav.appendChild(sc);
  }
}
function go(i) {
  idx = i; peek = null; const P = PUZ[idx];
  sel = P && answers[P.id] !== undefined ? P.best : null;
  render(); if (P) draw();
  window.scrollTo({top: 0, behavior: "smooth"});
}
window.addEventListener("resize", draw);
document.addEventListener("keydown", ev => {
  if (ev.ctrlKey || ev.metaKey || ev.altKey || /INPUT|TEXTAREA|SELECT/.test(ev.target.tagName)) return;
  const P = PUZ[idx], k = ev.key.toUpperCase();
  if (k === "ARROWLEFT" && idx > 0) go(idx - 1);
  else if (k === "ARROWRIGHT" && idx < PUZ.length) go(idx + 1);
  else if (!P) return;
  else if (LETTERS.includes(k) && LETTERS.indexOf(k) < P.options.length) select(LETTERS.indexOf(k));
  else if ("1234".includes(k) && +k <= P.options.length) select(+k - 1);
  else if (k === "ENTER" && ev.target.tagName !== "BUTTON") {
    if (answers[P.id] === undefined) decide(); else go(idx + 1);
  } else return;
  ev.preventDefault();
});
{ const ne = PUZ.filter(p => p.level === "入門").length;
  if (ne) $("levels").textContent = ` 1〜${ne}問目は入門編（点線の番号）、そのあとは実戦編です。`; }
go(Math.max(0, PUZ.findIndex(p => answers[p.id] === undefined)));
</script>
